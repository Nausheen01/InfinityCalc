<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" type="text/css"/>
    <!-- <link rel="stylesheet" href="utils.css" type="text/css"/> -->
</head>
<body>
    
    
        <div class="calculator">
            <button class="theme-toggle">🌙</button>
            <button class="voice-btn">🎤</button>
            <div class="history"></div>

            <!-- Display Screen -->

            <input class="display" type="text" readonly>

            <!-- Buttons -->

            <div class="buttons">
            <button class="btn gray">C</button>
            <button class="btn gray">+/-</button>
            <button class="btn gray">%</button>
            <button class="btn orange">/</button>
        

            <button class="btn gray">7</button>
            <button class="btn gray">8</button>
            <button class="btn gray">9</button>
            <button class="btn orange">x</button>
        

            <button class="btn gray">4</button>
            <button class="btn gray">5</button>
            <button class="btn gray">6</button>
            <button class="btn orange">-</button>
        

            <button class="btn gray">1</button>
            <button class="btn gray">2</button>
            <button class="btn gray">3</button>
            <button class="btn orange">+</button>
        
            <button class="btn zero">0</button>
            <button class="btn">.</button>
            <button class="btn orange">=</button>
            
        </div>
        
       
    </div> 
    
    <script src="script.js"></script>
    <!-- <audio src="click.mp3" id="clickSound"></audio> -->
     <audio id="clickSound" src="./click.mp3"></audio>
     

</body>
</html>
